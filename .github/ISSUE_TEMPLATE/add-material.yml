name: Add course material or clarify a requirement
description: Record new course slides, a Moodle announcement or an actual tutor reply
title: '[Material] '
body:
  - type: textarea
    id: source
    attributes:
      label: Source and date
      description: Actual path uploaded under sources, the Moodle announcement time, or the source of the tutor's reply
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Effect on tasks and requirements
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The material is within the course's authorised scope and contains no passwords, personal signatures or sensitive information
        - label: The original file, extracted text and sources/INDEX.md / manifest are updated, or clearly marked as pending
